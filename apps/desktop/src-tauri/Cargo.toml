[package]
name = "desktop"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.3"
git2 = "0.21.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "io-std", "sync", "macros", "rt-multi-thread", "time", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }
