[package]
name = "liosvideo-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "liosvideo"
path = "src/main.rs"

[lib]
name = "liosvideo_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.17"
deno_core = "0.334"
deno_error = "0.5"
deno_ast = { version = "0.53", features = ["transpiling"] }
wgpu = "24.0"
bytemuck = { version = "1.21", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3", "wav", "isomp4", "alac", "flac"] }
openh264 = "0.6"
mp4 = "0.14"
fdk-aac-rs = "0.1.0"
