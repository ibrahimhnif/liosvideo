[package]
name = "liosvideo-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "liosvideo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.17"
