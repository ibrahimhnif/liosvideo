name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build desktop installers (.dmg, .AppImage, .deb, .msi)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # one Cargo workspace at the root: everything builds into ./target
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter desktop exec playwright install chromium

      - name: Svelte & TypeScript check
        run: pnpm --filter desktop check

      - name: Unit tests
        run: pnpm -r test

      - name: Browser tests (Desktop & Runtime WebGPU)
        run: |
          pnpm --filter desktop test:browser
          pnpm --filter liosvideo test:gpu

      - name: Rust tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test -p liosvideo-cli

  # Releases: the installers and CLI binaries build in parallel with the tests into a draft
  # release; `publish` makes it public only when the tests and every build have passed.
  create-release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create (or reuse) the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f name="Liosvideo $TAG" -F draft=true \
              -f body='Download the installer for your platform below. See the README for a full download table.' -q .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build CLI (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-latest, target: x86_64-apple-darwin }
          - { platform: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p liosvideo-cli --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/liosvideo
            target/${{ matrix.target }}/release/liosvideo.exe
          if-no-files-found: error

  build-desktop:
    name: Build Desktop Image (${{ matrix.platform }})
    needs: create-release
    # create-release is skipped outside tags; build anyway for a manual workflow_dispatch run
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_desktop)) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Desktop App
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build Tauri Desktop App (workflow artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: './apps/desktop'
          args: ${{ matrix.args }}

      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: liosvideo-${{ matrix.platform }}
          path: |
            target/release/bundle/**
            target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [test, create-release, build-cli, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli

      - name: Package CLI (same names install.sh downloads)
        run: |
          mkdir -p out
          lipo -create -output liosvideo cli/cli-aarch64-apple-darwin/liosvideo cli/cli-x86_64-apple-darwin/liosvideo
          chmod +x liosvideo cli/cli-x86_64-unknown-linux-gnu/liosvideo
          tar -czf out/liosvideo-cli-macos.tar.gz liosvideo
          tar -czf out/liosvideo-cli-linux-x64.tar.gz -C cli/cli-x86_64-unknown-linux-gnu liosvideo
          tar -czf out/liosvideo-cli-windows-x64.tar.gz -C cli/cli-x86_64-pc-windows-msvc liosvideo.exe

      - name: Upload CLI and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.create-release.outputs.id }}
        run: |
          for f in out/*.tar.gz; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" -q ".[] | select(.name == \"$name\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/gzip" \
              --data-binary @"$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" > /dev/null
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true > /dev/null

  update-readme:
    name: Sync Download Links
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update README download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node scripts/sync-downloads.mjs "$TAG"

      - name: Commit and push README
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update download links for ${GITHUB_REF_NAME} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
